<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root {
  --gold: #c8a96e; --gold2: #f0d090; --blue: #1a9fff; --purple: #9b59f5;
  --teal: #00e5c0; --red: #ff4455; --bg0: #04060e; --bg1: #080d1a;
  --bg2: #0d1525; --bg3: #121d30; --border: #1e2d4a; --text: #c5d4e8; --textdim: #5a7090;
  --silver: #b0c4de; --prismatic: #e8a0ff;
}
html,body{height:100%;background:var(--bg0);overflow:hidden;font-family:'Noto Sans JP','Rajdhani',sans-serif;color:var(--text);}
#root{height:100%;display:flex;flex-direction:column;}

@keyframes popIn {
  0% { transform: scale(0.5); opacity: 0; }
  70% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* POPアップのスタイル修正 */
.champ-pop-up {
  /* position: fixed; 等はJS側の親要素が担当するので不要になります */
  animation: popInSimple 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes popInSimple {
  0% { transform: scale(0.5); opacity: 0; }
  70% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* ステージ進行バーのスタイル */
.stage-tracker {
  display: flex;
  align-items: center;
  background: #08101a;
  border: 1px solid #1e2d4a;
  border-top: none;
  border-radius: 0 0 10px 10px;
  padding: 4px 20px;
  gap: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  position: relative;
}

.stage-num {
  font-family: 'Orbitron';
  font-weight: 900;
  color: #c5d4e8;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.round-dots {
  display: flex;
  align-items: center;
  gap: 10px;
}

.round-icon {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: grayscale(1);
  opacity: 0.3;
  transition: all 0.3s;
}

.round-icon.active {
  filter: grayscale(0);
  opacity: 1;
  transform: scale(1.2);
}

/* 画像にあったひし形のカレントマーカー */
.round-icon.active::after {
  content: '';
  position: absolute;
  bottom: -12px;
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 8px solid var(--blue);
}


@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes starUpAnim{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes prismaticGlow{0%{box-shadow:0 0 8px #ff00ff,0 0 16px #00ffff}33%{box-shadow:0 0 8px #ffff00,0 0 16px #ff00ff}66%{box-shadow:0 0 8px #00ffff,0 0 16px #ffff00}100%{box-shadow:0 0 8px #ff00ff,0 0 16px #00ffff}}

.menu-btn { padding:12px 25px; border:1px solid var(--border); background:var(--bg2); color:white; font-family:'Noto Sans JP','Orbitron'; cursor:pointer; border-radius:8px; transition:all 0.2s; text-align:center; font-weight:700;}
.menu-btn:hover { background:var(--bg3); border-color:var(--blue); box-shadow:0 0 15px var(--blue); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

.aug-card-silver { border-color: var(--silver) !important; box-shadow: 0 0 12px rgba(176,196,222,0.3); }
.aug-card-silver:hover { border-color: white !important; box-shadow: 0 0 20px rgba(176,196,222,0.6) !important; }
.aug-card-gold { border-color: var(--gold) !important; box-shadow: 0 0 12px rgba(200,169,110,0.4); }
.aug-card-gold:hover { border-color: var(--gold2) !important; box-shadow: 0 0 20px rgba(200,169,110,0.7) !important; }
.aug-card-prismatic { border-color: var(--prismatic) !important; animation: prismaticGlow 2s infinite; }
.aug-card-prismatic:hover { box-shadow: 0 0 30px rgba(232,160,255,0.8) !important; }

.aug-tier-silver { color: var(--silver); }
.aug-tier-gold { color: var(--gold2); }
.aug-tier-prismatic { 
  background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
  background-size: 200%;
  -webkit-text-fill-color: transparent;
  animation: shimmer 2s linear infinite;


  
}
</style>

const createRNG = (seed) => {
  let h = 2166136261 >>> 0;
  const s = seed.toString();
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return () => {
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
};



function rollShop(level, rng){
  const odds={1:{1:100}, 2:{1:100}, 3:{1:75,2:25,3:0,4:0,5:0},4:{1:55,2:30,3:15,4:0,5:0},5:{1:45,2:33,3:20,4:2,5:0}}[level] || {1:100};
  return Array(5).fill(null).map(()=>{
    const roll = rng() * 100;
    let cum = 0;
    const cost = [1,2,3,4,5].find(c => { cum += (odds[c] || 0); return roll < cum; }) || 1;
    const pool = CHAMPS.filter(c => c.cost === cost);
    return {...pool[Math.floor(rng() * pool.length)], uid: rng(), star: 1};
  });
}

const AugmentScreen = ({ onPick, rng, augmentTierBoost = 0, isNoMoreAugments = false }) => {
  const [tier] = useState(() => {
    const baseTierRoll = rng() * 100;
    const adjusted = baseTierRoll - (augmentTierBoost * 30);
    if (adjusted < 9) return 'prismatic';
    if (adjusted < 74) return 'gold';
    return 'silver';
  });

  const [viewBoard, setViewBoard] = useState(false);

  const [augmentSetup] = useState(() => {
    const pool = [...AUGMENTS_DATA[tier]];
    const drawn = [];
    while (drawn.length < 6 && pool.length > 0) {
      const idx = Math.floor(rng() * pool.length);
      drawn.push(pool.splice(idx, 1)[0]);
    }
    return { initial: drawn.slice(0, 3), backups: drawn.slice(3, 6) };
  });

  const [choices, setChoices] = useState(augmentSetup.initial);
  const [rerolledSlots, setRerolledSlots] = useState([false, false, false]);

  const handleReroll = (idx) => {
    if (rerolledSlots[idx]) return;
    const nextAug = augmentSetup.backups[idx];
    if (nextAug) {
      const nc = [...choices]; nc[idx] = nextAug; setChoices(nc);
      const nr = [...rerolledSlots]; nr[idx] = true; setRerolledSlots(nr);
    }
  };

  if (isNoMoreAugments) return null;

  return (
    <div style={{
      position: 'fixed',
      inset: 0,
      // 🌟 viewBoard中は透明にするが、レイヤー自体は残す（下の盤面を触らせない）
      background: viewBoard ? 'rgba(0,0,0,0)' : 'rgba(4,6,14,.98)',
      zIndex: 2000,
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      justifyContent: 'center',
      transition: 'all 0.3s ease',
      // 🌟 pointer-eventsは常にautoにすることで、下の盤面操作をブロック
      pointerEvents: 'auto'
    }}>
      
      {/* 🌟 盤面確認ボタン（操作ロックの「ガラス」の上に配置） */}
      <button 
        onClick={() => setViewBoard(!viewBoard)}
        className="menu-btn"

  );
};

}}>

</div>
        <button className="menu-btn" style={{ width:220, boxShadow:'0 10px 30px rgba(0,0,0,0.5)' }} onClick={() => startWithSeed()}>ゲームスタート</button>

  const rng = useMemo(() => createRNG(seed), [seed]);

const initBoard = () => {

  const [gold, setGold] = useState(0);
  const [level, setLevel] = useState(1);
  const [xp, setXp] = useState(0);
  const [round, setRound] = useState('1-1');
  const [shop, setShop] = useState(() => rollShop(1, rng));
  const [bench, setBench] = useState(Array(9).fill(null));
  const [board, setBoard] = useState(initBoard);
  const [inventory, setInventory] = useState([]);
  const [augments, setAugments] = useState([]);
  const [passiveBuffs, setPassiveBuffs] = useState([]);

  const [showAugment, setShowAugment] = useState(false);
  const [mergeToast, setMergeToast] = useState(null);
  const [isFinished, setIsFinished] = useState(false);
  const [traitTooltipData, setTraitTooltipData] = useState(null);
  const [tooltipData, setTooltipData] = useState(null);
  const [freeRerolls, setFreeRerolls] = useState(0);
  const [maxInterest, setMaxInterest] = useState(5);
  const [xpCostReduction, setXpCostReduction] = useState(0);
  const [augmentTierBoost, setAugmentTierBoost] = useState(0);
  const [noMoreAugments, setNoMoreAugments] = useState(false);
  const [afkRoundsLeft, setAfkRoundsLeft] = useState(0);
  const [droppedComps, setDroppedComps] = useState([]); // 🌟 ドロップ済みの素材アイテム履歴
  const hoverTimer = useRef(null);

  // 🌟 画像保存用のRefとStateを追加
  const resultRef = useRef(null);
  const [isSaving, setIsSaving] = useState(false);
  
  // 🌟 今回遭遇した神（リザルト表示用。ランダムで選ばれた1体目を運命の神とする）
  const chosenGod = encounterGods[0];

  // 🌟 キャプチャ処理
  const handleSaveImage = async () => {
    if (!resultRef.current) return;
    setIsSaving(true);
    try {
      // html2canvasでDOMを画像化 (外部画像も読み込めるように useCORS: true を指定)

      });

      link.click();
      showMsg('画像を保存しました！');
    } catch (err) {
      console.error(err);
      showMsg('画像の保存に失敗しました');
    }
    setIsSaving(false);
  };


  

// 🌟 POP用のタイマーを管理する箱
  const dropMsgTimer = useRef(null);

  const showMsg = useCallback((msg, duration = 3000) => {
    setDropMsg(msg);
    // 🌟 前のタイマーが残っていたらキャンセルする（瞬殺されるのを防ぐ）
    if (dropMsgTimer.current) clearTimeout(dropMsgTimer.current);
    // 新しいタイマーをセット
    dropMsgTimer.current = setTimeout(() => setDropMsg(null), duration);
  }, []);

  const addXp = useCallback((amount) => {
    setXp(prevXp => {
      setLevel(prevLevel => {
        let curL = prevLevel;
        let curX = prevXp + amount;
        while (curX >= (XP_FOR_NEXT_LEVEL[curL] || 999) && curL < 9) {
          curX -= XP_FOR_NEXT_LEVEL[curL];
          curL++;
        }
        setXp(curX);
        return curL;
      });
      return prevXp; // will be overwritten by setLevel callback
    });
  }, []);

  const addGold = useCallback((amount) => setGold(g => g + amount), []);
  const addItem = useCallback((item) => setInventory(prev => [...prev, item]), []);
  const addPassiveBuff = useCallback((buff) => setPassiveBuffs(prev => [...prev, buff]), []);
  const setLevelDirect = useCallback((lv) => setLevel(lv), []);
  const setMaxInterestFn = useCallback((v) => setMaxInterest(v), []);
  const setXpCostReductionFn = useCallback((v) => setXpCostReduction(v), []);
  const setAugmentTierBoostFn = useCallback((v) => setAugmentTierBoost(v), []);
  const setNoMoreAugmentsFn = useCallback((v) => setNoMoreAugments(v), []);
  const setAfkRoundsLeftFn = useCallback((v) => setAfkRoundsLeft(v), []);
  const addFreeRerolls = useCallback((n) => setFreeRerolls(prev => prev + n), []);

  const addChampToBench = useCallback((cost, count, rngFn) => {
    setBench(prev => {
      const nb = [...prev];
      const pool = CHAMPS.filter(c => c.cost === cost);
      for (let i = 0; i < count; i++) {
        const slot = nb.findIndex(x => !x);
        if (slot !== -1) nb[slot] = { ...pool[Math.floor(rngFn() * pool.length)], star: 1, uid: rngFn(), items: [] };
      }
      return nb;
    });
  }, []);

  const addChampToBenchDirect = useCallback((champ) => {
    setBench(prev => {
      const nb = [...prev];
      const slot = nb.findIndex(x => !x);
      if (slot !== -1) nb[slot] = champ;
      return nb;
    });
  }, []);

  // Appコンポーネント内のState定義のあたりに追加
const [pendingUnits, setPendingUnits] = useState([]); // 🌟 待機中のユニット

// 🌟 ベンチの空きを監視して、待機ユニットを自動で追加するロジック
useEffect(() => {
  if (pendingUnits.length > 0) {
    const emptySlot = bench.findIndex(x => !x);
    if (emptySlot !== -1) {
      // 空きがある場合：1体ベンチに移動
      const nextUnit = pendingUnits[0];
      setBench(prev => {
        const nb = [...prev];
        nb[emptySlot] = nextUnit;
        return nb;
      });
      setPendingUnits(prev => prev.slice(1));
    } else {
      // 空きがない場合：警告を出す（1回だけ出るように調整）
      showMsg(
        <div style={{ color: 'var(--red)', fontWeight: 900 }}>
          ⚠️ ベンチが満杯です！<br/>チャンピオンを売却して空きを作ってください
        </div>
      );
    }
  }
}, [bench, pendingUnits]);


  const augmentHelpers = useMemo(() => ({
    addGold, addXp, addItem, addPassiveBuff, showMsg, getJaName,
    addChampToBench: (cost, count, r) => addChampToBench(cost, count, r || rng),
    addChampToBenchDirect,
    addPendingUnits: (units) => setPendingUnits(prev => [...prev, ...units]),
    setLevel: setLevelDirect, setMaxInterest: setMaxInterestFn,
    setXpCostReduction: setXpCostReductionFn, setAugmentTierBoost: setAugmentTierBoostFn,
    setNoMoreAugments: setNoMoreAugmentsFn, setAfkRoundsLeft: setAfkRoundsLeftFn,
    addFreeRerolls,
  }), [addGold, addXp, addItem, addPassiveBuff, showMsg, addChampToBench, addChampToBenchDirect, setLevelDirect, setMaxInterestFn, setXpCostReductionFn, setAugmentTierBoostFn, setNoMoreAugmentsFn, setAfkRoundsLeftFn, addFreeRerolls, rng]);

  useEffect(() => {
    if (mergeToast) {
      const timer = setTimeout(() => setMergeToast(null), 2500);
      return () => clearTimeout(timer);
    }
  }, [mergeToast]);

  const [dropPlan] = useState(() => {
    const roll = rng() * 100;
    // 10%で1個、20%で2個(10~30)、60%で3個(30~90)、10%で4個(90~100)
    const target = roll < 10 ? 1 : roll < 30 ? 2 : roll < 90 ? 3 : 4;
    return { targetComp: target, droppedComp: 0 };
  });

　const executeOrbDrop = (type) => {
    const roll = rng() * 100;
    const rowStyle = { display: 'flex', alignItems: 'center', gap: 6 };
    const iconStyle = (cost) => ({ width: 50, height: 50, border: `1px solid ${COST_COLORS[cost]}`, borderRadius: 3 });

    // 🌟 複数体ドロップ用の汎用ヘルパー
    const rollMultiple = (cost, count) => {
      const pool = CHAMPS.filter(c => c.cost === cost);
      const droppedUnits = [];
      for (let i = 0; i < count; i++) {
        const c = pool[Math.floor(rng() * pool.length)];
        const unit = { ...c, star: 1, uid: rng(), items: [] };
        addChampToBenchDirect(unit);
        droppedUnits.push(unit);
      }
      return (
        <div style={rowStyle}>
          <div style={{ display:'flex', gap:2 }}>
            {droppedUnits.map((u, idx) => (
              <img key={idx} src={boardIcon(u.img)} style={iconStyle(cost)} title={u.jaName} />
            ))}
          </div>
          <span>{droppedUnits.length > 1 ? `${droppedUnits[0].jaName}等` : droppedUnits[0].jaName}</span>
        </div>
      );
    };

    if (type === 'GRAY') {
      if (roll < 48) return rollMultiple(1, 2); // 🌟 1コス×2体（個別抽選）
      if (roll < 95) return rollMultiple(2, 1); // 🌟 2コス×1体
      if (roll < 98) {
        setInventory(p => [...p, CONSUMABLES.REFORGER]); setGold(g => g + 2);
        return <div style={rowStyle}><img src={getMetaTFTItemUrl('Reforger')} style={iconStyle(1)} /><span style={{ fontSize: '24px', fontWeight: 'bold', color: 'white' }}>再合成 + 2G</span></div>;
      }
      if (roll < 99) {
        setInventory(p => {
          const nb = [...p];
          const ex = nb.findIndex(i => i.id === 'remover');
          if (ex !== -1) nb[ex] = { ...nb[ex], count: (nb[ex].count || 1) + 1 };
          else nb.push({ ...CONSUMABLES.REMOVER, count: 1 });
          return nb;
        });
        setGold(g => g + 2);
        return <div style={rowStyle}><img src={getMetaTFTItemUrl('itemremover')} style={iconStyle(1)} /><span style={{ fontSize: '24px', fontWeight: 'bold', color: 'white' }}>除去装置 + 2G</span></div>;
      }
      setInventory(p => [...p, CONSUMABLES.LESSER_DUPE]);
      return <div style={rowStyle}><img src={getMetaTFTItemUrl('Lesser Champion Duplicator')} style={iconStyle(1)} /><span style={{ fontSize: '24px', fontWeight: 'bold', color: 'white' }}>小型複製機</span></div>;

    } else if (type === 'BLUE') {
      if (roll < 33) return rollMultiple(3, 2); // 🌟 3コス×2体（個別抽選）
      if (roll < 64) {
        const res = rollMultiple(3, 1);
        setGold(g => g + 3);
        return <div style={rowStyle}>{res}<span> + 3G</span></div>;
      }
      if (roll < 95) return rollMultiple(2, 3); // 🌟 2コス×3体（個別抽選）
      if (roll < 97) {
        const res = rollMultiple(2, 2);
        setInventory(p => [...p, CONSUMABLES.LESSER_DUPE]);
        return <div style={rowStyle}><img src={getMetaTFTItemUrl('Lesser Champion Duplicator')} style={iconStyle(1)} /><span style={{ fontSize: '24px', fontWeight: 'bold', color: 'white' }}>＋</span>{res}</div>;
      }
      if (roll < 99) {
        setInventory(p => [...p, CONSUMABLES.REFORGER]); setGold(g => g + 6);
        return <div style={rowStyle}><img src={getMetaTFTItemUrl('Reforger')} style={iconStyle(1)} /><span style={{ fontSize: '24px', fontWeight: 'bold', color: 'white' }}>再合成 + 6G</span></div>;
      }
      const pool = CHAMPS.filter(c => c.cost === 3);
      const c = pool[Math.floor(rng() * pool.length)];
      setInventory(p => [...p, CONSUMABLES.CHAMP_DUPE]);
      addChampToBenchDirect({ ...c, star: 1, uid: rng(), items: [] });
      return <div style={rowStyle}><img src={getMetaTFTItemUrl('Champion Duplicator')} style={iconStyle(1)} /><span style={{ fontSize: '24px', fontWeight: 'bold', color: 'white' }}>＋</span><img src={boardIcon(c.img)} style={iconStyle(3)} /><span style={{ fontSize: '24px', fontWeight: 'bold', color: 'white' }}>{c.jaName}</span></div>;
    }
  };

  const triggerDrops = (isLastRound) => {
    // 🌟 基本のドロップ数（1〜2個）
    let dropCount = Math.floor(rng() * 2) +1;
    const remainingForStage = dropPlan.targetComp - dropPlan.droppedComp;

    // 🌟🌟🌟 新規追加：1-4の時に、まだ落とすべき素材の数が箱の数を上回っている場合、
    // 強制的に箱の数を増やして、確実に目標数の素材を吐き出させる！
    if (isLastRound && remainingForStage > dropCount) {
      dropCount = remainingForStage;
    }

    let newItems = [];
    let dropElements = [];
    let newlyDroppedIds = [];

    for (let i = 0; i < dropCount; i++) {
      const remainingComps = dropPlan.targetComp - dropPlan.droppedComp;
      let isItem = false;
      
      if (remainingComps > 0) {
        // 🌟 最終ラウンドで、残りの箱の数と落とすべき素材の数が一致したら強制ドロップ
        if (isLastRound && remainingComps >= (dropCount - i)) isItem = true;
        else if (rng() < 0.4) isItem = true;
      }
      
      if (isItem) {
        const comps = ITEMS.filter(it => it.type === 'comp');
        let availableComps = comps.filter(c => !droppedComps.includes(c.id) && !newlyDroppedIds.includes(c.id));
        
        if (availableComps.length === 0) {
          availableComps = comps;
        }

        const item = availableComps[Math.floor(rng() * availableComps.length)];
        
        newItems.push(item);
        newlyDroppedIds.push(item.id);
        dropPlan.droppedComp++; // 🌟 ここでしっかりカウントを進める
        
        dropElements.push(
          <div key={`item-${i}`} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <img src={getMetaTFTItemUrl(item.name)} style={{ width: 50, height: 50, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
            <span>{getJaName(item.name)}</span>
          </div>
        );
      } else {
        const orbType = rng() < 0.3 ? 'BLUE' : 'GRAY';
        const orbResult = executeOrbDrop(orbType);
        dropElements.push(<div key={`orb-${i}`}>{orbResult}</div>);
      }
    }

    if (newItems.length > 0) setInventory(prev => [...prev, ...newItems]);
    
    if (newlyDroppedIds.length > 0) {
      setDroppedComps(prev => [...prev, ...newlyDroppedIds]);
    }

    // 🌟 古いタイマーをリセットする仕様になった showMsg を使用
    showMsg(
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 15, flexWrap:'wrap' }}>
        {dropElements}
      </div>, 
      4000
    );
  };

  // レベルアップ処理（addXpの安定版）
  const applyXp = (amount, curLevel, curXp) => {
    let lv = curLevel;
    let x = curXp + amount;
    while (x >= (XP_FOR_NEXT_LEVEL[lv] || 999) && lv < 9) {
      x -= XP_FOR_NEXT_LEVEL[lv];
      lv++;
    }
    return { level: lv, xp: x };
  };

  const [isTransitioning, setIsTransitioning] = useState(false);

  const handleNextRound = (forcedRound) => {
    // 🌟 遷移中（3秒の間）は、クリックを完全に無視する
    if (isTransitioning) return;

    const currentR = forcedRound || round;
    // 終了判定
    if (currentR === '2-1') {
      setIsFinished(true);
      return;
    }
    
    const schedule = ['1-1', '1-2', '1-3', '1-4', '2-1'];
    const nextR = schedule[schedule.indexOf(currentR) + 1];

    // 🌟 遷移開始：ガードレイヤーを起動（操作不能にする）
    setIsTransitioning(true);

    // ==========================================
    // 1. 即座に実行する演出（POP表示と盤面変更）
    // ==========================================

    // 【1-1 → 1-2】運命の1体配布演出
    if (currentR === '1-1' && nextR === '1-2') {
      const pool = CHAMPS.filter(c => c.cost === 1);
      const chosen = pool[Math.floor(rng() * pool.length)];
      const unit = { ...chosen, star: 1, uid: rng(), items: [] };
      
      setBoard(prev => {
        const nb = [...prev];
        nb[17] = unit; // 盤面中央に配置
        return nb;
      });

      // 🌟 除去装置をスタック（重ねて）追加する処理
      setInventory(prev => {
        const nb = [...prev];

              }}>
                <img 
                  src={getAugmentIconUrl(a)} 
                  style={{ width: '85%', height: '85%', objectFit: 'contain' }} 
                  onError={(e) => e.target.style.display = 'none'}
                />
              </div>
              
              {/* 名前 */}
              <span style={{
                fontSize: 10,
                color: TIER_COLORS[a.tier],
                fontWeight: 900,
                lineHeight: 1.2,
                fontFamily: 'Noto Sans JP',
                wordBreak: 'break-all',
                padding: '0 4px'
              }}>
                {a.name}
              </span>
            </div>
          ))}
        </div>
      {/* 🌟 メインエリア全体の閉じタグの直前まで */}


      </div>

      {/* ベンチ */}
      <div style={{ background:'rgba(8,13,26,.92)', borderTop:'1px solid var(--border)', padding:'8px', display:'flex', justifyContent:'center', gap:4, flexShrink:0 }}>
        {bench.map((champ, i) => (
          <div 
            key={i} 
            onDragOver={e => e.preventDefault()} 
            onDrop={hDrop('bench', i)} 
            style={{ 
              width:54, 
              height:54, 
              borderRadius:8, 
              background:'rgba(13,21,37,.5)', 
              // 🌟 枠線の色をコストに合わせて動的に変更
              border: `1px solid ${champ ? COST_COLORS[champ.cost] : 'rgba(30,45,74,.4)'}`,
              // 🌟 ユニットがいる時は少しだけ発光させる
              boxShadow: champ ? `inset 0 0 10px ${COST_COLORS[champ.cost]}33` : 'none',
              display:'flex', 
              alignItems:'center', 
              justifyContent:'center', 
              position:'relative',
              transition: 'border 0.2s ease'
            }}
          >
            {champ && (
              <div draggable onDragStart={() => setDragSrc({ type:'bench', idx:i })} onMouseEnter={(e) => handleMouseEnter(e, champ)} onMouseLeave={handleMouseLeave} style={{ width:'100%', height:'100%', cursor:'grab', position:'relative' }}>
                <img src={boardIcon(champ.img)} style={{ width:'100%', height:'100%', objectFit:'cover', borderRadius:8, pointerEvents:'none' }} />
                <div style={{ position:'absolute', top:2, left:2, display:'flex', flexDirection:'column', gap:1 }}>
                  {(champ.items||[]).map((it, idx) => (<img key={idx} src={getMetaTFTItemUrl(it.name)} style={{ width:12, height:12, border:'1px solid white', borderRadius:2, background:'black' }} />))}
                </div>
                <div style={{ position:'absolute', bottom:2, left:0, right:0 }}><Stars star={champ.star} /></div>
              </div>
            )}
            {!champ && <span style={{ color:'var(--border)', fontSize:12 }}>＋</span>}
          </div>
        ))}
      </div>

      {/* ショップ */}
      {/* ショップエリア */}
     {/* 🌟 ショップ・NEXTボタン エリア 🌟 */}
      <div style={{ height:140, background:'rgba(4,6,14,.98)', borderTop:'2px solid var(--border)', display:'flex', flexShrink:0, position: 'relative' }}>
        
        {/* 左側〜中央：ショップ内容（ドロップ判定はここに残す） */}
        <div onDragOver={e => e.preventDefault()} onDrop={hDrop('shop', -1)} style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          {round !== '1-1' && round !== '1-2' && !showAugment ? (
            <React.Fragment>
              {/* ヘッダー情報（レベル・XP・ゴールド・確率） */}
              <div style={{ height:26, display:'flex', alignItems:'center', padding:'0 15px', background:'rgba(0,0,0,0.4)', borderBottom:'1px solid rgba(30,45,74,.6)', fontFamily:'Orbitron', position:'relative' }}>
                <div style={{ display:'flex', alignItems:'center' }}>
                  <div style={{ fontWeight:900, fontSize:13, color:'white', marginRight:10 }}>LV {level}{teamSizeBonus > 0 ? `+${teamSizeBonus}` : ''}</div>
                  <div style={{ color:'var(--textdim)', fontSize:11, fontFamily:'Rajdhani', fontWeight:700 }}>{xp} / {XP_FOR_NEXT_LEVEL[level]||'-'}</div>
                </div>
                <div style={{ position:'absolute', left:'50%', transform:'translateX(-50%)', display:'flex', alignItems:'center', justifyContent:'center', height:'100%', padding:'0 30px', color:'white', fontSize:15, fontWeight:900, background:'linear-gradient(90deg, transparent 0%, rgba(13,21,37,0.9) 20%, rgba(13,21,37,0.9) 80%, transparent 100%)' }}>
                  <span style={{ color:'var(--gold2)', marginRight:8, fontSize:12, textShadow:'0 0 5px var(--gold)' }}>💰</span> {gold}
                </div>
                <div style={{ display:'flex', gap:12, fontSize:10, fontWeight:900, marginLeft:'auto' }}>
                  {(()=>{
                    const odds = {1:[100,0,0,0,0],2:[100,0,0,0,0],3:[75,25,0,0,0],4:[55,30,15,0,0],5:[45,33,20,2,0],6:[35,40,20,5,0],7:[19,35,35,10,1],8:[15,25,35,20,5],9:[10,20,25,35,10]}[level] || [100,0,0,0,0];
                    const colors = ['#8a9aaa','#44cc66','#3399ff','#cc44ff','#ffcc44'];
                    return odds.map((o,i) => o > 0 && <div key={i} style={{ color:colors[i] }}>• {o}%</div>);
                  })()}
                </div>
              </div>

              {/* 操作エリア（XP・リロール・チャンピオン枠） */}
              <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:12, padding:'0 20px', height:'100%' }}>
                <div style={{ display:'flex', flexDirection:'column', gap:6, width:130, flexShrink:0 }}>
                  {/* XP購入ボタン */}
                  <button
                    onClick={() => {
                      const cost = xpCost;
                      if (gold >= cost) {
                        setGold(g => g - cost);
                        const extraXp = passiveBuffs.some(b => b.type === 'level_up_aug') ? 2 : 0;
                        const { level: nl, xp: nx } = applyXp(4 + extraXp, level, xp);
                        setLevel(nl); setXp(nx);
                      }
                    }}
                    style={{ height:38, background:'linear-gradient(135deg, rgba(16,35,57,1) 0%, rgba(26,159,255,0.15) 100%)', border:'1px solid rgba(26,159,255,.4)', borderRadius:4, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 10px', cursor:'pointer', color:'white' }}>
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-start', fontFamily:'Noto Sans JP' }}>
                      <span style={{ fontSize:13, fontWeight:700, lineHeight:1.2 }}>XP購入</span>
                      <span style={{ fontSize:11, color:'var(--gold2)', fontFamily:'Orbitron' }}>💰 {xpCost}</span>
                    </div>
                  </button>
                  {/* リロールボタン */}
                  <button
                    onClick={() => {
                      if (freeRerolls > 0) { setFreeRerolls(fr => fr - 1); setShop(rollShop(level, rng)); return; }
                      if (gold >= 2) {
                        setGold(g => g - 2); setShop(rollShop(level, rng));
                        if (passiveBuffs.some(b => b.type === 'prism_ticket') && rng() < 0.5) setFreeRerolls(fr => fr + 1);
                      }
                    }}
                    style={{ height:38, background:'linear-gradient(135deg, rgba(42,32,16,1) 0%, rgba(200,169,110,0.15) 100%)', border:`1px solid ${freeRerolls>0?'var(--teal)':'rgba(200,169,110,.4)'}`, borderRadius:4, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 10px', cursor:'pointer', color:'white' }}>
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-start', fontFamily:'Noto Sans JP' }}>
                      <span style={{ fontSize:13, fontWeight:700, lineHeight:1.2 }}>リロール</span>
                      <span style={{ fontSize:11, color:freeRerolls>0?'var(--teal)':'var(--gold2)', fontFamily:'Orbitron' }}>{freeRerolls > 0 ? `🎲 無料(${freeRerolls})` : '💰 2'}</span>
                    </div>
                  </button>
                </div>

                {/* チャンピオン枠 */}
                <div style={{ display:'flex', gap:8, height:'100%', padding:'8px 0' }}>
                  {shop.map((champ, i) => (
                    <div key={i} draggable={!!champ && gold>=champ.cost} onDragStart={champ ? () => setDragSrc({ type:'shop', idx:i }) : undefined}
                      onClick={() => {
                        const unit = shop[i]; if (!unit || gold < unit.cost) return;
                        const slot = bench.findIndex(x => !x); if (slot === -1) return;
                        let nb = [...bench], ns = [...shop];
                        nb[slot] = { ...unit, star:1, uid:rng(), items:[] }; ns[i] = null;
                        setGold(g => g - unit.cost); setShop(ns);
                        const counts = {}; [...nb, ...board].forEach(u => { if (u) { const k = `${u.id}_${u.star||1}`; counts[k]=(counts[k]||0)+1; } });
                        // 🌟 ショップ内 onClick 内の進化ロジック
                        for (const k in counts) {
                          if (counts[k] >= 3) {
                            const [id, s] = k.split('_');
                            const star = parseInt(s);
                            
                            if (star < 3) {
                              let toRem = 3;
                              let collected = [];
                              let targetBoardIdx = -1; // 進化後の配置先（ボード）
                              // 1. まずボード上の同名・同星ユニットを消去＆アイテム回収
                              for (let j = 0; j < board.length && toRem > 0; j++) {
                                if (board[j] && board[j].id === id && board[j].star === star) {
                                  if (targetBoardIdx === -1) targetBoardIdx = j; // 最初に見つけたボードの位置を記憶
                                  if (board[j].items) collected.push(...board[j].items);
                                  board[j] = null;
                                  toRem--;
                                }
                              }
                              // 2. 残りの必要数をベンチから消去＆アイテム回収
                              for (let j = 0; j < nb.length && toRem > 0; j++) {
                                if (nb[j] && nb[j].id === id && nb[j].star === star) {
                                  if (nb[j].items) collected.push(...nb[j].items);
                                  nb[j] = null;
                                  toRem--;
                                }
                              }
                              // 3. 進化したユニットを作成（アイテムは3つまで）
                              const up = { ...CHAMPS.find(c => c.id === id), star: star + 1, uid: rng(), items: collected.slice(0, 3) };
                              // 4. 配置：ボードの位置が記憶されていればボードへ、そうでなければベンチへ
                              if (targetBoardIdx !== -1) {
                                board[targetBoardIdx] = up;
                              } else {
                                const slot = nb.findIndex(x => !x);
                                if (slot !== -1) nb[slot] = up;
                              }
                              setMergeToast(up);
                              break;
                            }
                          }
                        }
                        setBench(nb);
                      }}
                      style={{ height:'100%', aspectRatio:'400/237', flexShrink:0, borderRadius:4, background:champ?'rgba(10,15,25,1)':'transparent', border:champ?`1px solid ${COST_COLORS[champ.cost]}`:'1px solid rgba(30,45,74,.3)', cursor:champ?'pointer':'default', position:'relative', overflow:'hidden', opacity:champ&&gold<champ.cost?0.4:1 }}>
                      {champ && (
                        <React.Fragment>
                          <img src={champIcon(champ.img)} style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', pointerEvents:'none' }}/>
                          <div style={{ position:'absolute', inset:0, background:'linear-gradient(0deg, rgba(10,15,25,1) 0%, transparent 45%, rgba(10,15,25,0.7) 100%)' }}></div>
                          <div style={{ position:'absolute', top:0, left:'50%', transform:'translateX(-50%)', width:26, height:6, background:COST_COLORS[champ.cost], borderBottomLeftRadius:4, borderBottomRightRadius:4, border:'1px solid rgba(0,0,0,0.5)', borderTop:'none' }}></div>
                          <div style={{ position:'absolute', top:12, left:6, display:'flex', flexDirection:'column', gap:3 }}>
                            {champ.traits.map(t => (<div key={t} style={{ display:'flex', alignItems:'center', gap:4 }}><img src={getTraitIconUrl(t)} style={{ width:12, height:12, filter:'drop-shadow(1px 1px 2px #000)' }} onError={(e) => e.target.style.display='none'}/><span style={{ fontSize:10, color:'white', fontWeight:600, textShadow:'1px 1px 2px #000' }}>{getTraitJaName(t)}</span></div>))}
                          </div>
                          <div style={{ position:'absolute', bottom:4, left:6, right:6, display:'flex', justifyContent:'space-between', alignItems:'flex-end' }}>
                            <span style={{ fontSize:12, fontWeight:900, color:'white', textShadow:'1px 1px 2px #000', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{champ.jaName}</span>
                            <span style={{ fontSize:12, fontWeight:900, color:'var(--gold2)', textShadow:'1px 1px 2px #000', fontFamily:'Orbitron' }}>💰 {champ.cost}</span>
                          </div>
                        </React.Fragment>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </React.Fragment>
          ) : (
            /* 🌟 隠されている時の表示 */
            <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Noto Sans JP', color:'var(--textdim)', fontSize:12, opacity:0.5 }}>
              {showAugment ? 'オーグメントを選択中...' : '・・・戦闘中・・　右下の「NEXT」を押してね'}
            </div>
          )}
        </div>

        {/* 🌟 右側：NEXTボタンエリア（常に表示） */}
        <div style={{ width: 140, borderLeft: '1px solid rgba(30,45,74,.8)', background: 'rgba(8,13,26,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '15px', zIndex: 10 }}>
          <button 
            onClick={() => handleNextRound()} 
            style={{ 
              width: '100%', height: '70px',
              background: round === '2-1' ? 'var(--red)' : 'var(--blue)', 
              border: '1px solid white', borderRadius: 8, 
              fontFamily: 'Orbitron', fontSize: '18px', color: 'white', 
              cursor: 'pointer', fontWeight: 900,
              boxShadow: '0 0 15px rgba(26,159,255,0.3)',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              transition: 'all 0.2s ease'
            }}
            onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.05)'; }}
            onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; }}
          >
            <span style={{ fontSize: '11px', opacity: 0.8, marginBottom: '2px', fontFamily: 'Noto Sans JP' }}>
              {round === '2-1' ? '最終結果へ' : '次のラウンド'}
            </span>
            <span>{round === '2-1' ? 'FINISH' : 'NEXT ➔'}</span>
          </button>
        </div>

      </div>
    </div>
  );
}



ReactDOM.createRoot(document.getElementById('root')).render(<Main/>);
</script>
</body>
</html>
