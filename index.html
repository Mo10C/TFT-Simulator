/* ── スタイル設定 ── */
*{margin:0;padding:0;box-sizing:border-box;}
:root {
  --gold: #c8a96e; --gold2: #f0d090; --blue: #1a9fff; --purple: #9b59f5;
  --teal: #00e5c0; --red: #ff4455; --bg0: #04060e; --bg1: #080d1a;
  --bg2: #0d1525; --bg3: #121d30; --border: #1e2d4a; --text: #c5d4e8; --textdim: #5a7090;
}
html,body{height:100%;background:var(--bg0);overflow:hidden;font-family:'Noto Sans JP','Rajdhani',sans-serif;color:var(--text);}
#root{height:100%;display:flex;flex-direction:column;}

@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes starUpAnim{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

.menu-btn { padding:12px 25px; border:1px solid var(--border); background:var(--bg2); color:white; font-family:'Noto Sans JP','Orbitron'; cursor:pointer; border-radius:8px; transition:all 0.2s; text-align:center; font-weight:700;}
.menu-btn:hover { background:var(--bg3); border-color:var(--blue); box-shadow:0 0 15px var(--blue); }

/* スクロールバー */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

const createRNG = (seed) => {
  let h = 2166136261 >>> 0;
  const s = seed.toString();
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return () => {
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
};

function rollShop(level, rng){
  const odds={1:{1:100}, 2:{1:100}, 3:{1:75,2:25,3:0,4:0,5:0},4:{1:55,2:30,3:15,4:0,5:0},5:{1:45,2:33,3:20,4:2,5:0}}[level] || {1:100};
  return Array(5).fill(null).map(()=>{
    const roll = rng() * 100;
    let cum = 0;
    const cost = [1,2,3,4,5].find(c => { cum += (odds[c] || 0); return roll < cum; }) || 1;
    const pool = CHAMPS.filter(c => c.cost === cost);
    return {...pool[Math.floor(rng() * pool.length)], uid: rng(), star: 1};
  });
}

const AugmentScreen=({onPick, rng})=>{
  const [choices, setChoices] = useState(() => {
    const res = []; const p = [...AUGMENTS];
    while(res.length < 3) res.push(p.splice(Math.floor(rng()*p.length), 1)[0]);
    return res;
  });
  const [rerolledSlots, setRerolledSlots] = useState([false, false, false]);
  const handleReroll = (idx) => {
    if(rerolledSlots[idx]) return;
    const currentIds = choices.map(c => c.id);
    const available = AUGMENTS.filter(a => !currentIds.includes(a.id));
    const newAug = available[Math.floor(rng() * available.length)];
    if(newAug) {
      const nc = [...choices]; nc[idx] = newAug; setChoices(nc);
      const nr = [...rerolledSlots]; nr[idx] = true; setRerolledSlots(nr);
    }
  };
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(4,6,14,.98)',zIndex:2000,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:40,animation:'fadeIn 0.5s ease', padding:20}}>
      <div style={{fontFamily:'Noto Sans JP,Orbitron',fontSize:'clamp(18px, 5vw, 26px)',fontWeight:900,color:'var(--gold)',letterSpacing:4, textAlign:'center'}}>オーグメントを選択してください</div>
      <div style={{display:'flex',gap:20, flexWrap:'wrap', justifyContent:'center'}}>
        {choices.map((aug, i)=>(
          <div key={i} style={{display:'flex', flexDirection:'column', gap:15, width:220}}>
            <div onClick={() => onPick(aug)} style={{height:180, background:'var(--bg2)', border:'1px solid var(--border)', borderRadius:12, padding:24, cursor:'pointer', transition:'all 0.2s', textAlign:'center'}} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--gold)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
              <div style={{fontFamily:'Noto Sans JP',fontSize:15,fontWeight:700,color:'white',marginBottom:12}}>{aug.name}</div>
              <div style={{fontFamily:'Noto Sans JP',fontSize:12,color:'var(--textdim)',lineHeight:1.6}}>{aug.desc}</div>
            </div>
            <button onClick={() => handleReroll(i)} disabled={rerolledSlots[i]} style={{background: rerolledSlots[i] ? 'rgba(30,45,74,.4)' : 'rgba(200,169,110,.1)', border: `1px solid ${rerolledSlots[i] ? 'var(--border)' : 'var(--gold)'}`, color: rerolledSlots[i] ? 'var(--textdim)' : 'var(--gold)', borderRadius: 6, padding: '8px', cursor: rerolledSlots[i] ? 'default' : 'pointer', fontFamily: 'Noto Sans JP', fontSize: 11, fontWeight: 700}}>
              {rerolledSlots[i] ? '再抽選済み' : '再抽選'}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ────────────────────────────────────────────────────────
   4. メインアプリケーション
   ──────────────────────────────────────────────────────── */
function Main() {
  const [view, setView] = useState('MENU');
  const [seed, setSeed] = useState("");
  const [gameKey, setGameKey] = useState(0);
  const startWithSeed = (targetSeed) => {
    setSeed(targetSeed || Math.random().toString(36).substring(2, 9).toUpperCase());
    setGameKey(prev => prev + 1);
    setView('GAME');
  };

  if (view === 'MENU') {
    return (
      <div style={{
        height: '100vh', 
        display: 'flex', 
        flexDirection: 'column', 
        alignItems: 'center', 
        justifyContent: 'center', 
        gap: 30, 
        backgroundImage: `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("https://assets.st-note.com/production/uploads/images/263587712/rectangle_large_type_2_386d7257054746a6649e14bdb1432725.jpeg?width=4000&height=4000&fit=bounds&format=jpg&quality=90")`,
        backgroundSize: 'cover',
        backgroundPosition: 'center',
        padding: 20,
        animation: 'fadeIn 1s ease'
      }}>
        <div style={{
          fontFamily: 'Orbitron', 
          fontSize: 'clamp(30px, 10vw, 70px)',
          fontWeight: 900, 
          color: '#fff',
          letterSpacing: 15, 
          textShadow: `
            0 0 5px rgba(0,0,0,1),
            0 0 10px rgba(0,0,0,0.8),
            0 0 20px var(--gold),
            0 0 40px var(--gold)
          `,
          textAlign: 'center',
          transform: 'skewX(-5deg)', 
          opacity: 0.95
        }}>
          TFT SET 17　1ステ DEMO
        </div>
        
        <button className="menu-btn" style={{width: 220, boxShadow: '0 10px 30px rgba(0,0,0,0.5)', transition: 'all 0.3s'}} onClick={() => startWithSeed()}>
          ゲームスタート
        </button>
        
        <div style={{display: 'flex', gap: 5, background: 'rgba(0,0,0,0.5)', padding: '10px', borderRadius: '12px', backdropFilter: 'blur(6px)'}}>
            <input 
              style={{padding: 12, borderRadius: 8, border: '1px solid var(--border)', background: 'var(--bg1)', color: 'white', fontFamily: 'Orbitron', width: 160}} 
              placeholder="シード値..." 
              value={seed} 
              onChange={(e) => setSeed(e.target.value.toUpperCase())}
            />
            <button className="menu-btn" onClick={() => startWithSeed(seed)}>開始</button>
        </div>
      </div>
    );
  }
  return <App key={gameKey} seed={seed} onRestart={() => startWithSeed(seed)} onNewGame={() => startWithSeed()} />;
}

function App({ seed, onRestart, onNewGame }){
  const rng = useMemo(() => createRNG(seed), [seed]);
  
  // 【修正】シード値からこの試合の星座テキストを決定する
  const currentStargazerDesc = useMemo(() => {
    return stargazerVariants[Math.floor(rng() * stargazerVariants.length)];
  }, [rng]);

  const initBoard = () => {
    const b = Array(28).fill(null);
    const pool = CHAMPS.filter(c => c.cost === 1);
    b[17] = { ...pool[Math.floor(rng() * pool.length)], star: 1, uid: rng() };
    return b;
  };

  const [gold,setGold]=useState(0);
  const [level,setLevel]=useState(1);
  const [xp,setXp]=useState(0);
  const [round,setRound]=useState('1-1');
  const [shop,setShop]=useState(()=>rollShop(1, rng));
  const [bench,setBench]=useState(Array(9).fill(null));
  const [board,setBoard]=useState(initBoard);
  const [inventory,setInventory]=useState([]);
  const [augments,setAugments]=useState([]);
  const [dragSrc,setDragSrc]=useState(null);
  const [dropMsg,setDropMsg]=useState(null);
  const [showAugment, setShowAugment] = useState(false);
  const [mergeToast,setMergeToast]=useState(null);
  const [isFinished, setIsFinished] = useState(false);
  const [traitTooltipData, setTraitTooltipData] = useState(null);
  const [tooltipData, setTooltipData] = useState(null);
  const hoverTimer = useRef(null);

  const handleMouseEnter = (e, champ) => {
    if (!champ) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const isRight = rect.left > window.innerWidth / 2; 
    
    hoverTimer.current = setTimeout(() => {
      setTooltipData({ champ, x: rect.left, y: rect.top, isRight });
    }, 2000); 
  };

  const handleMouseLeave = () => {
    if (hoverTimer.current) {
      clearTimeout(hoverTimer.current);
      hoverTimer.current = null;
    }
    setTooltipData(null);
  };

  const handleTraitMouseEnter = (e, trait, count) => {
    const rect = e.currentTarget.getBoundingClientRect();
    setTraitTooltipData({ trait, count, x: rect.left, y: rect.top });
  };

  useEffect(() => {
    if (mergeToast) {
      const timer = setTimeout(() => setMergeToast(null), 2500);
      return () => clearTimeout(timer);
    }
  }, [mergeToast]);

  const [dropPlan] = useState(() => ({ targetComp: Math.floor(rng() * 4) + 1, droppedComp: 0 }));

  const addUnitsToBench = (cost, count) => {
    setBench(prev => {
        const nb = [...prev];
        const pool = CHAMPS.filter(c => c.cost === cost);
        for(let i=0; i<count; i++) {
            const slot = nb.findIndex(x => !x);
            if(slot !== -1) nb[slot] = { ...pool[Math.floor(rng() * pool.length)], star: 1, uid: rng() };
        }
        return nb;
    });
  };

  const executeOrbDrop = (type) => {
    const roll = rng() * 100;
    let msg = "";
    if (type === 'GRAY') {
        if (roll < 48) { addUnitsToBench(1, 2); msg = "⚪グレー: コスト１チャンピオン ×２体"; }
        else if (roll < 95) { addUnitsToBench(2, 1); msg = "⚪グレー: コスト２チャンピオン ×１体"; }
        else if (roll < 98) { setInventory(p => [...p, CONSUMABLES.REFORGER]); setGold(g => g + 2); msg = "⚪ グレー: 再合成装置 + 2G"; }
        else if (roll < 99) { setInventory(p => [...p, CONSUMABLES.REMOVER]); setGold(g => g + 2); msg = "⚪ グレー: 磁力式除去装置 + 2G"; }
        else { setInventory(p => [...p, CONSUMABLES.LESSER_DUPE]); msg = "⚪ グレー: 小型チャンピオン複製機"; }
    } else if (type === 'BLUE') {
        if (roll < 33) { addUnitsToBench(3, 2); msg = "🔵 ブルー: コスト３チャンピオン ×２体"; }
        else if (roll < 64) { setGold(g => g + 3); addUnitsToBench(3, 1); msg = "🔵 ブルー: ３G + コスト３チャンピオン ×１体"; }
        else if (roll < 95) { addUnitsToBench(2, 3); msg = "🔵 ブルー: スト２チャンピオン ×３体"; }
        else if (roll < 97) { setInventory(p => [...p, CONSUMABLES.LESSER_DUPE]); addUnitsToBench(2, 2); msg = "🔵 ブルー: 小型チャンピオン複製機 + コスト２チャンピオン ×２体"; }
        else if (roll < 99) { setInventory(p => [...p, CONSUMABLES.REFORGER]); setGold(g => g + 6); msg = "🔵 ブルー: 再合成装置 + ６G"; }
        else { setInventory(p => [...p, CONSUMABLES.CHAMP_DUPE]); addUnitsToBench(3, 1); msg = "🔵 ブルー: チャンピオン複製機 + コスト３チャンピオン ×１体"; }
    }
    return msg;
  };

 const triggerDrops = (isLastRound) => {
    const dropCount = Math.floor(rng() * 2) + 1; 
    let newItems = [];
    let dropElements = []; // 文字列の代わりにReact要素を入れる配列

    for(let i = 0; i < dropCount; i++) {
        const remainingComps = dropPlan.targetComp - dropPlan.droppedComp;
        let isItem = false;
        if (remainingComps > 0) {
            if (isLastRound && remainingComps >= (dropCount - i)) isItem = true;
            else if (rng() < 0.4) isItem = true;
        }
        if (isItem) {
            const comps = ITEMS.filter(it => it.type === 'comp');
            const item = comps[Math.floor(rng() * comps.length)];
            newItems.push(item);
            dropPlan.droppedComp++;
            
            // 🌟 🎁の代わりに画像を使ったUIを追加
            dropElements.push(
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <img 
                        src={getMetaTFTItemUrl(item.name)} 
                        style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} 
                    />
                    <span>{getJaName(item.name)}</span>
                </div>
            );
        } else {
            const orbType = rng() < 0.3 ? 'BLUE' : 'GRAY';
            dropElements.push(<div key={i}>{executeOrbDrop(orbType)}</div>);
        }
    }
    if (newItems.length > 0) setInventory(prev => [...prev, ...newItems]);
    
    // 🌟 メッセージを横に並べて1つの通知としてセット
    setDropMsg(
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 15, flexWrap: 'wrap' }}>
            {dropElements}
        </div>
    );
    setTimeout(() => setDropMsg(null), 4000); 
  };

  const handleNextRound = (forcedRound) => {
    const currentR = forcedRound || round;
    if (currentR === '2-1') { setIsFinished(true); return; }
    const schedule = ['1-1','1-2','1-3','1-4','2-1'];
    const nextR = schedule[schedule.indexOf(currentR) + 1];
    if (currentR.startsWith('1-')) triggerDrops(currentR === '1-4');
    if (nextR === '2-1') setShowAugment(true);
    setRound(nextR);
    setGold(g => {
        const interest = Math.min(5, Math.floor(g / 10));
        const baseIncome = { '1-2': 2, '1-3': 2, '1-4': 3, '2-1': 4 }[nextR] || 5;
        return g + baseIncome + interest;
    });
    let curL = level; let curX = xp + 2;
    while (curX >= (XP_FOR_NEXT_LEVEL[curL] || 999) && curL < 6) { curX -= XP_FOR_NEXT_LEVEL[curL]; curL++; }
    setLevel(curL); setXp(curX); setShop(rollShop(curL, rng));
  };


  const debugDropAllItems = () => {
    // 素材アイテム(comp)と消費アイテム(consumable)をすべて取得
    const allComps = ITEMS.filter(it => it.type === 'comp');
    const allConsumables = Object.values(CONSUMABLES);
    
    setInventory(prev => [...prev, ...allComps, ...allConsumables]);
    setDropMsg("🛠️ デバッグ: 全アイテムをインベントリに追加しました");
    setTimeout(() => setDropMsg(null), 2000);
  };

  const hDrop = (targetType, targetIdx) => (e) => {
    e.preventDefault();
    if (!dragSrc) return;

    let nb = [...bench];
    let nbrd = [...board];
    let ns = [...shop];
    let ninv = [...inventory];

    if ((targetType === 'board' || targetType === 'bench') && dragSrc.type === 'inventory') {
      const targetArr = targetType === 'board' ? nbrd : nb;
      const unit = targetArr[targetIdx];
      const newItem = ninv[dragSrc.idx];

      if (unit && newItem) {
        if (!unit.items) unit.items = [];

        // 🌟 消費アイテム（Consumable）のロジック
        if (newItem.type === 'consumable') {
          if (newItem.id === 'remover') {
            if (unit.items.length === 0) {
              setDropMsg("⚠️ アイテムを持っていません！");
              setDragSrc(null); return;
            }
            ninv.push(...unit.items);
            unit.items = [];
            ninv.splice(dragSrc.idx, 1);
            setDropMsg(
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <img src={getMetaTFTItemUrl(newItem.name)} style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
                <span>アイテムを取り外しました</span>
              </div>
            );
          }
          else if (newItem.id === 'reforger') {
            if (unit.items.length === 0) {
              setDropMsg("⚠️ アイテムを持っていません！");
              setDragSrc(null); return;
            }
            const newItems = unit.items.map(it => {
              if (it.type === 'comp') {
                const comps = ITEMS.filter(x => x.type === 'comp');
                return comps[Math.floor(rng() * comps.length)];
              } else if (it.type === 'completed') {
                const recipes = Object.values(ITEM_RECIPES);
                const randomRecipe = recipes[Math.floor(rng() * recipes.length)];
                return { ...randomRecipe, type: 'completed' };
              }
              return it;
            });
            ninv.push(...newItems);
            unit.items = [];
            ninv.splice(dragSrc.idx, 1);
            setDropMsg(
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <img src={getMetaTFTItemUrl(newItem.name)} style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
                <span>アイテムを再合成して取り外しました</span>
              </div>
            );
          }
          else if (newItem.id === 'champ_dupe' || newItem.id === 'lesser_dupe') {
            if (newItem.id === 'lesser_dupe' && unit.cost > 3) {
              setDropMsg("⚠️ 1〜3コストのチャンピオンにのみ使用できます");
              setDragSrc(null); return;
            }
            const emptySlot = nb.findIndex(x => !x);
            if (emptySlot === -1) {
              setDropMsg("⚠️ ベンチに空きがありません");
              setDragSrc(null); return;
            }
            const copy = { ...CHAMPS.find(c => c.id === unit.id), star: 1, uid: rng(), items: [] };
            nb[emptySlot] = copy;
            ninv.splice(dragSrc.idx, 1);
            setDropMsg(
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <img src={getMetaTFTItemUrl(newItem.name)} style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
                <span>{unit.jaName}を複製しました！</span>
              </div>
            );

            // 🌟 複製後のスターアップチェック（アイテム引き継ぎ対応）
            const counts={}; [...nb,...nbrd].forEach(u=>{if(u){const k=`${u.id}_${u.star||1}`; counts[k]=(counts[k]||0)+1;}});
            for(const k in counts){
              if(counts[k]>=3){
                const [id,s]=k.split('_'); const star=parseInt(s);
                if(star<3){
                  let toRem=3; let collected = [];
                  for(let i=0;i<nb.length&&toRem>0;i++) if(nb[i]&&nb[i].id===id&&nb[i].star===star){ if(nb[i].items) collected.push(...nb[i].items); nb[i]=null; toRem--; }
                  for(let i=0;i<nbrd.length&&toRem>0;i++) if(nbrd[i]&&nbrd[i].id===id&&nbrd[i].star===star){ if(nbrd[i].items) collected.push(...nbrd[i].items); nbrd[i]=null; toRem--; }
                  
                  const up={...CHAMPS.find(c=>c.id===id), star:star+1, uid:rng(), items: collected.slice(0, 3)};
                  if (collected.length > 3) { ninv.push(...collected.slice(3)); setDropMsg("⚠️ 溢れたアイテムを回収しました"); }
                  
                  const slot = nb.findIndex(x=>!x); if(slot !== -1) nb[slot]=up;
                  setMergeToast(up); break;
                }
              }
            }
          }
          
          setInventory(ninv.filter(Boolean));
          setTimeout(() => setDropMsg(null), 2000);
          setDragSrc(null);
          setBoard(nbrd);
          setBench(nb);
          return;
        }

        // 🌟 通常アイテムの装備・合成処理
        let merged = false;
        if (newItem.type === 'comp') {
          const existingCompIdx = unit.items.findIndex(it => it.type === 'comp');
          if (existingCompIdx !== -1) {
            const itemA = unit.items[existingCompIdx];
            const itemB = newItem;
            const key1 = `${itemA.id}_${itemB.id}`;
            const key2 = `${itemB.id}_${itemA.id}`;
            const recipe = ITEM_RECIPES[key1] || ITEM_RECIPES[key2];
            if (recipe) {
              unit.items[existingCompIdx] = { ...recipe, type: 'completed' };
              merged = true;
              setDropMsg(
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <img src={getMetaTFTItemUrl(recipe.name)} style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
                  <span>合成成功: {getJaName(recipe.name)}!</span>
                </div>
              );
            }
          }
        }

        if (!merged) {
          if (unit.items.length < 3) {
            unit.items.push(newItem);
            setDropMsg(
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <img src={getMetaTFTItemUrl(newItem.name)} style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
                <span>装備完了: {getJaName(newItem.name)}</span>
              </div>
            );
          } else {
            setDropMsg("⚠️ アイテムスロットが一杯です！");
            setDragSrc(null);
            return;
          }
        }

        ninv.splice(dragSrc.idx, 1);
        setInventory(ninv.filter(Boolean));
        setTimeout(() => setDropMsg(null), 2000);
      }
      
      setDragSrc(null);
      setBoard(nbrd);
      setBench(nb);
      return;
    }

    // ② インベントリ内のアイテム同士の合成・再合成・入れ替え
    if (targetType === 'inventory') {
      if (dragSrc.type === 'inventory') {
        const srcIdx = dragSrc.idx;
        const itemA = ninv[srcIdx]; // ドラッグしているアイテム
        const itemB = ninv[targetIdx]; // 重ねられた先のアイテム

        if (itemA && itemB && srcIdx !== targetIdx) {
          // 🌟 1. 通常の素材同士の合成
          if (itemA.type === 'comp' && itemB.type === 'comp') {
            const key1 = `${itemA.id}_${itemB.id}`;
            const key2 = `${itemB.id}_${itemA.id}`;
            const recipe = ITEM_RECIPES[key1] || ITEM_RECIPES[key2];

            if (recipe) {
              ninv[targetIdx] = { ...recipe, type: 'completed' };
              ninv.splice(srcIdx, 1);
              setInventory(ninv.filter(Boolean));
              setDropMsg(
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <img src={getMetaTFTItemUrl(recipe.name)} style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
                  <span>作成完了: {getJaName(recipe.name)}</span>
                </div>
              );
              setDragSrc(null); return;
            }
          }

          // 🌟 2. 再合成装置（Reforger）をアイテムに重ねた場合
          if (itemA.id === 'reforger' && (itemB.type === 'comp' || itemB.type === 'completed')) {
            let transformedItem;
            if (itemB.type === 'comp') {
              // 素材は別の素材へ
              const comps = ITEMS.filter(x => x.type === 'comp');
              transformedItem = comps[Math.floor(rng() * comps.length)];
            } else {
              // 完成品は別の完成品へ
              const recipes = Object.values(ITEM_RECIPES);
              const randomRecipe = recipes[Math.floor(rng() * recipes.length)];
              transformedItem = { ...randomRecipe, type: 'completed' };
            }

            ninv[targetIdx] = transformedItem; // アイテムを変化
            ninv.splice(srcIdx, 1); // 再合成装置を消去
            setInventory(ninv.filter(Boolean));
            setDropMsg(
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <img src={getMetaTFTItemUrl(transformedItem.name)} style={{ width: 18, height: 18, border: '1px solid rgba(255,255,255,0.6)', borderRadius: 3 }} />
                <span>アイテムを再合成しました！</span>
              </div>
            );
            setTimeout(() => setDropMsg(null), 2000);
            setDragSrc(null); return;
          }
        }

        // 🌟 3. それ以外（ただの入れ替え）
        const temp = ninv[targetIdx];
        ninv[targetIdx] = ninv[srcIdx];
        ninv[srcIdx] = temp;
        setInventory(ninv.filter(Boolean));
      } 
      setDragSrc(null);
      return;
    }

    if (targetType === 'shop') {
        const src = dragSrc.type === 'bench' ? nb : nbrd; 
        const mover = src[dragSrc.idx];
        if (mover) {
          setGold(g => g + (mover.cost * (mover.star === 3 ? 9 : (mover.star === 2 ? 3 : 1))));
          src[dragSrc.idx] = null;
        }
    } else if(!(dragSrc.type==='shop' && targetType==='board')){
        let mover = null;
        if(dragSrc.type==='shop'){
            mover=ns[dragSrc.idx]; if(!mover||gold<mover.cost||nb[targetIdx]) { setDragSrc(null); return; }
            setGold(g=>g-mover.cost); ns[dragSrc.idx]=null; mover={...mover,star:1,uid:rng(), items:[]};
        } else {
            const src = dragSrc.type==='bench'?nb:nbrd; mover=src[dragSrc.idx];
            if(dragSrc.type==='bench' && targetType==='board' && !nbrd[targetIdx] && nbrd.filter(Boolean).length>=level) {
                setDropMsg("⚠️ 盤面が一杯です！"); setTimeout(()=>setDropMsg(null),2000); setDragSrc(null); return;
            }
            src[dragSrc.idx]=null;
        }
        if(mover){
            const target = targetType==='bench'?nb:nbrd; const ex=target[targetIdx]; target[targetIdx]=mover;
            if(ex){ if(dragSrc.type==='bench') nb[dragSrc.idx]=ex; else nbrd[dragSrc.idx]=ex; }
        }
    }

    setShop(ns);

    // 🌟 全体：自動スターアップ判定とアイテム引き継ぎ
    const counts={}; [...nb,...nbrd].forEach(u=>{if(u){const k=`${u.id}_${u.star||1}`; counts[k]=(counts[k]||0)+1;}});
    for(const k in counts){
        if(counts[k]>=3){
            const [id,s]=k.split('_'); const star=parseInt(s);
            if(star<3){
                let toRem=3; let collected = [];
                for(let i=0;i<nb.length&&toRem>0;i++) if(nb[i]&&nb[i].id===id&&nb[i].star===star){ if(nb[i].items) collected.push(...nb[i].items); nb[i]=null; toRem--; }
                for(let i=0;i<nbrd.length&&toRem>0;i++) if(nbrd[i]&&nbrd[i].id===id&&nbrd[i].star===star){ if(nbrd[i].items) collected.push(...nbrd[i].items); nbrd[i]=null; toRem--; }
                
                const up={...CHAMPS.find(c=>c.id===id), star:star+1, uid:rng(), items: collected.slice(0, 3)};
                if (collected.length > 3) { ninv.push(...collected.slice(3)); setDropMsg("⚠️ 溢れたアイテムを回収しました"); }
                
                const slot = nb.findIndex(x=>!x); if(slot !== -1) nb[slot]=up;
                setMergeToast(up); break;
            }
        }
    }
    setBench(nb); setBoard(nbrd); setInventory(ninv.filter(Boolean)); setDragSrc(null);
  };

  const traitCounts={}; const seenIds=new Set();
  board.filter(Boolean).forEach(c=>{ if(!seenIds.has(c.id)){ seenIds.add(c.id); c.traits.forEach(t=>{traitCounts[t]=(traitCounts[t]||0)+1;}); } });
  
  const TRAIT_TIERS = {
    'Anima': [3, 6], 'Arbiter': [2, 3], 'Dark Star': [2, 4, 6, 9], 'Mecha': [3, 4, 6],
    'Meeple': [3, 5, 7, 10], 'N.O.V.A.': [2, 5], 'Primordian': [2, 3], 'Psionic': [2, 4],
    'Space Groove': [1, 3, 5, 7, 10], 'Stargazer': [3, 4, 5, 6, 7], 'Timebreaker': [2, 3, 4],
    'Bastion': [2, 4, 6], 'Brawler': [2, 4, 6], 'Challenger': [2, 3, 4, 5], 'Channeler': [2, 3, 4, 5],
    'Fateweaver': [2, 4], 'Marauder': [2, 4, 6], 'Replicator': [2, 4], 'Rogue': [2, 3, 4, 5],
    'Shepherd': [3, 5, 7], 'Sniper': [2, 3, 4, 5], 'Vanguard': [2, 4, 6], 'Voyager': [2, 3, 4, 5, 6],
    'Redeemer': [1],'missfortuneuniquetrait': [1]
  };

  const getMinReq = (t) => TRAIT_TIERS[t] ? TRAIT_TIERS[t][0] : 2;
  const activeTraits = Object.entries(traitCounts).filter(([t,c]) => c >= getMinReq(t)).sort((a,b)=>b[1]-a[1]);
  const inactiveTraits = Object.entries(traitCounts).filter(([t,c]) => c < getMinReq(t)).sort((a,b)=>b[1]-a[1]);

  if (isFinished) {
    return (
      <div style={{height:'100vh',width:'100vw',background:'var(--bg0)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20,animation:'fadeIn 0.8s ease', padding:20, overflowY:'auto'}}>
        <div style={{fontFamily:'Noto Sans JP,Orbitron', fontSize:'clamp(20px, 8vw, 36px)', fontWeight:900, color:'var(--gold)', letterSpacing:6, textAlign:'center'}}>結果</div>
        <div style={{color:'var(--textdim)', fontFamily:'Orbitron', fontSize:14, letterSpacing:2}}>シード値: {seed}</div>
        <div style={{display:'flex', gap:20, flexWrap:'wrap', justifyContent:'center'}}>
          <div style={{width:220, display:'flex', flexDirection:'column', gap:12}}>
             <div style={{background:'var(--bg2)', padding:15, borderRadius:12, border:'1px solid var(--blue)'}}><div style={{fontSize:10, color:'var(--blue)', fontFamily:'Noto Sans JP'}}>最終レベル</div><div style={{fontSize:24, fontWeight:900, color:'white'}}>LV. {level}</div></div>
             <div style={{background:'var(--bg2)', padding:15, borderRadius:12, border:'1px solid var(--gold)'}}><div style={{fontSize:10, color:'var(--gold)', fontFamily:'Noto Sans JP'}}>最終ゴールド</div><div style={{fontSize:24, fontWeight:900, color:'white'}}>{gold}G</div></div>
             <div style={{background:'var(--bg2)', padding:15, borderRadius:12, border:'1px solid var(--teal)', maxHeight:180, overflow:'auto'}}>
                {activeTraits.map(([t,c])=>(<div key={t} style={{fontSize:14, color:'var(--gold)', fontWeight:900, marginBottom:5, display:'flex', alignItems:'center', gap:6}}><img src={getTraitIconUrl(t)} style={{width:18, height:18}} onError={(e)=>e.target.style.display='none'}/><span>{c} {getTraitJaName(t)}</span></div>))}
             </div>
             <button className="menu-btn" onClick={onRestart}>同じシード値で再挑戦</button>
             <button className="menu-btn" onClick={onNewGame}>新しいゲーム</button>
             <button className="menu-btn" style={{fontSize:11, padding:'8px'}} onClick={() => { navigator.clipboard.writeText(seed); alert("シード値をコピーしました！"); }}>シード値をコピー</button>
          </div>
          <div style={{background:'rgba(255,255,255,0.03)', padding:20, borderRadius:20, border:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'center'}}>
            <div style={{transform: 'scale(0.8)'}}>
              {[0,1,2,3].map(row=>(<div key={row} style={{display:'flex',gap:2,marginLeft:row%2===1?30:0}}>{[0,1,2,3,4,5,6].map(col=><HexCell key={row*7+col} champ={board[row*7+col]} size={60} />)}</div>))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{height:'100vh',width:'100vw',background:'var(--bg0)',display:'flex',flexDirection:'column',overflow:'hidden',userSelect:'none',position:'relative'}}>
      <ChampionTooltip data={tooltipData} />
      <TraitTooltip data={traitTooltipData} stargazerDesc={currentStargazerDesc} />

      {showAugment && <AugmentScreen onPick={(aug)=>{setAugments([...augments, aug]); setShowAugment(false);}} rng={rng}/>}
      {dropMsg && <div style={{position:'fixed', top:'15%', left:'50%', transform:'translateX(-50%)', background:'rgba(26,159,255,.9)', border:'1px solid white', borderRadius:10, padding:'10px 20px', zIndex:3000, fontFamily:'Noto Sans JP', fontSize:12, textAlign:'center', maxWidth:'90%'}}>{dropMsg}</div>}
      {mergeToast && <div style={{position:'fixed',top:'25%',left:'50%',transform:'translateX(-50%)',background:'rgba(8,13,26,.97)',border:`1px solid ${STAR_COLORS[mergeToast.star]}`,borderRadius:12,padding:20,zIndex:4000,animation:'starUpAnim .4s ease',display:'flex',alignItems:'center',gap:15}}><img src={boardIcon(mergeToast.img)} style={{width:60,height:60,borderRadius:8,objectFit:'cover',border:`2px solid ${STAR_COLORS[mergeToast.star]}`}}/><div><div style={{fontFamily:'Noto Sans JP',fontSize:11,color:STAR_COLORS[mergeToast.star]}}>スター昇格！</div><div style={{fontSize:20,fontWeight:900,color:'white'}}>{mergeToast.jaName}</div></div></div>}

      {/* ヘッダー */}
      <div style={{height:48,background:'rgba(8,13,26,.98)',borderBottom:'1px solid rgba(30,45,74,.8)',display:'flex',alignItems:'center',padding:'0 10px',gap:12,zIndex:50, flexShrink:0}}>
        <div style={{fontFamily:'Orbitron',fontWeight:900,fontSize:12,color:'var(--gold)'}}>{seed}</div>
        <div style={{fontFamily:'Orbitron',fontSize:15,fontWeight:700,color:'white'}}>{round}</div>
        <div style={{display:'flex',gap:6, overflowX:'auto', flex:1}}>
          {augments.map((a, i) => <div key={i} style={{fontSize:9,background:'rgba(200,169,110,0.15)',border:'1px solid var(--gold)',padding:'2px 6px',borderRadius:4,color:'var(--gold)', whiteSpace:'nowrap', fontFamily:'Noto Sans JP'}}>{a.name}</div>)}
        </div>

        <button 
    onClick={debugDropAllItems} 
    style={{
      background: 'rgba(200,169,110,.15)', 
      border:'1px solid var(--gold)', 
      borderRadius:6, 
      padding:'6px 10px', 
      fontFamily:'Noto Sans JP', 
      fontSize:10, 
      color:'var(--gold)', 
      cursor: 'pointer',
      marginRight: '5px'
    }}
  >
    DEBUG: ALL ITEMS
  </button>
        
        <button 
          onClick={() => handleNextRound()} 
          style={{
            background: round === '2-1' ? 'var(--red)' : 'rgba(26,159,255,.15)', 
            border:'1px solid white', 
            borderRadius:6, 
            padding:'6px 12px', 
            fontFamily:'Noto Sans JP', 
            fontSize:11, 
            color:'white', 
            cursor: 'pointer', 
            fontWeight:700
          }}>
          {round === '2-1' ? 'Finish' : 'NEXT'}
        </button>
      </div>

      {/* メインエリア */}
      <div style={{flex:1,display:'flex',overflow:'hidden', position:'relative'}}>
        {/* 左サイドバー */}
        <div style={{display:'flex', background:'rgba(8,13,26,.6)', borderRight:'1px solid var(--border)', flexShrink:0}}>
          <div style={{width:150, padding:8, overflowY:'auto', borderRight:'1px solid rgba(30,45,74,.3)'}}>
            <div style={{background:'rgba(26,159,255,.1)', border:'1px solid var(--blue)', borderRadius:6, padding:6, marginBottom:10, textAlign:'center'}}>
              <div style={{fontSize:8, color:'var(--blue)', fontFamily:'Noto Sans JP'}}>ユニット数</div>
              <div style={{fontSize:14, color:'white', fontWeight:900, fontFamily:'Orbitron'}}>{board.filter(Boolean).length}/{level}</div>
            </div>
            
            {/* アクティブシナジー */}
            {activeTraits.map(([t,c])=>(
              <div key={t} onMouseEnter={(e) => handleTraitMouseEnter(e, t, c)} onMouseLeave={() => setTraitTooltipData(null)} style={{fontSize:10,marginBottom:4,background:'rgba(200,169,110,.15)',borderRadius:6,padding:6,border:'1px solid var(--gold)',color:'white', fontWeight:700, display:'flex', alignItems:'center', gap:6}}>
                <img src={getTraitIconUrl(t)} style={{width:14, height:14}} onError={(e)=>e.target.style.display='none'}/><span>{c} {getTraitJaName(t)}</span>
              </div>
            ))}

            {/* 非アクティブシナジー */}
            {inactiveTraits.map(([t,c])=>(
              <div key={t} onMouseEnter={(e) => handleTraitMouseEnter(e, t, c)} onMouseLeave={() => setTraitTooltipData(null)} style={{fontSize:10,marginBottom:4,background:'rgba(13,21,37,.4)',borderRadius:6,padding:6,border:'1px dashed rgba(30,45,74,.5)',color:'var(--textdim)', display:'flex', alignItems:'center', gap:6}}>
                <img src={getTraitIconUrl(t)} style={{width:14, height:14, opacity:0.5}} onError={(e)=>e.target.style.display='none'}/><span>{c} {getTraitJaName(t)}</span>
              </div>
            ))}
          </div>
          
          {/* アイテム欄 */}
          <div style={{width:56, padding:8, overflowY:'auto', display:'flex', flexDirection:'column', alignItems:'center', gap:8}}>
            <div style={{fontSize:9, color:'var(--gold)', fontFamily:'Noto Sans JP', fontWeight:900, textAlign:'center'}}>アイテム</div>
            {inventory.map((it, i) => (
              <div key={i} draggable onDragStart={() => setDragSrc({ type: 'inventory', idx: i })} onDragOver={e => e.preventDefault()} onDrop={hDrop('inventory', i)} title={it?.name ? getJaName(it.name) : ""}
              style={{
                width: 36, height: 36, background: 'var(--bg0)', borderRadius: 6, border: `1px solid ${it?.type === 'completed' ? 'var(--gold)' : 'var(--border)'}`, cursor: 'grab', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', flexShrink: 0, boxShadow: it?.type === 'completed' ? '0 0 10px rgba(200,169,110,0.3)' : 'none'
              }}>
              {it?.imgId ? (
                <img src={getMetaTFTItemUrl(it.name)} style={{ width: '100%', height: '100%', objectFit: 'cover', pointerEvents: 'none' }} onError={(e) => { e.target.src = `https://cdn.mobalytics.gg/assets/tft/images/game-items/set17/${it.name.toLowerCase().replace(/\s+/g, '-')}.png`; }} />
              ) : (
                <span style={{ fontSize: 18, pointerEvents: 'none' }}>{it?.icon}</span>
              )}
              </div>
            ))}
          </div>
        </div>
        
        {/* 盤面 */}
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center', overflow:'hidden'}}>
          <div style={{transform: 'scale(clamp(0.4, 0.9, 0.9))', transition:'transform 0.3s'}}>
            <div style={{display:'flex',flexDirection:'column',gap:2}}>
              {[0,1,2,3].map(row=>(
                <div key={row} style={{display:'flex',gap:2,marginLeft:row%2===1?39:0}}>
                  {[0,1,2,3,4,5,6].map(col=>(
                    <HexCell key={row*7+col} champ={board[row*7+col]} onDragStart={()=>setDragSrc({type:'board',idx:row*7+col})} onDrop={hDrop('board',row*7+col)} onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave} />
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* ベンチ */}
      <div style={{background:'rgba(8,13,26,.92)',borderTop:'1px solid var(--border)',padding:'8px',display:'flex',justifyContent:'center',gap:4, flexShrink:0}}>
        {bench.map((champ,i)=>(
          <div key={i} onDragOver={e=>e.preventDefault()} onDrop={hDrop('bench',i)} style={{width:54,height:54,borderRadius:8,background:'rgba(13,21,37,.5)',border:'1px solid rgba(30,45,74,.4)',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
           {champ && (
            <div draggable onDragStart={() => setDragSrc({ type: 'bench', idx: i })} onMouseEnter={(e) => handleMouseEnter(e, champ)}  onMouseLeave={handleMouseLeave} style={{ width: '100%', height: '100%', cursor: 'grab', position: 'relative' }}>
              <img src={boardIcon(champ.img)} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: 8, pointerEvents: 'none' }} />
              <div style={{ position: 'absolute', top: 2, left: 2, display: 'flex', flexDirection: 'column', gap: 1 }}>
                {(champ.items || []).map((it, idx) => (
                  <img key={idx} src={getMetaTFTItemUrl(it.name)} style={{ width: 12, height: 12, border: '1px solid white', borderRadius: 2, background: 'black' }} />
                ))}
              </div>
              <div style={{ position: 'absolute', bottom: 2, left: 0, right: 0 }}><Stars star={champ.star} /></div>
            </div>
          )}
            {!champ && <span style={{color:'var(--border)', fontSize:12}}>＋</span>}
          </div>
        ))}
      </div>

      {/* ショップ */}
      <div onDragOver={e=>e.preventDefault()} onDrop={hDrop('shop', -1)} style={{height:140,background:'rgba(4,6,14,.98)',borderTop:'2px solid var(--border)',display:'flex',flexDirection:'column', flexShrink:0}}>
        {round !== '1-1' ? (
          <React.Fragment>
            <div style={{height: 26, display:'flex', alignItems:'center', padding:'0 15px', background:'rgba(0,0,0,0.4)', borderBottom:'1px solid rgba(30,45,74,.6)', fontFamily:'Orbitron', position:'relative'}}>
              <div style={{display:'flex', alignItems:'center'}}>
                <div style={{fontWeight:900, fontSize:13, color:'white', marginRight:10}}>LV {level}</div>
                <div style={{color:'var(--textdim)', fontSize:11, fontFamily:'Rajdhani', fontWeight:700}}>{xp} / {XP_FOR_NEXT_LEVEL[level]||'-'}</div>
              </div>
              <div style={{position:'absolute', left:'50%', transform:'translateX(-50%)', display:'flex', alignItems:'center', justifyContent:'center', height:'100%', padding:'0 30px', color:'white', fontSize:15, fontWeight:900, background:'linear-gradient(90deg, transparent 0%, rgba(13,21,37,0.9) 20%, rgba(13,21,37,0.9) 80%, transparent 100%)'}}>
                <span style={{color:'var(--gold2)', marginRight:8, fontSize:12, textShadow:'0 0 5px var(--gold)'}}>💰</span> {gold}
              </div>
              <div style={{display:'flex', gap:12, fontSize:10, fontWeight:900, marginLeft:'auto'}}>
                {(()=>{
                  const odds = {1:[100,0,0,0,0],2:[100,0,0,0,0],3:[75,25,0,0,0],4:[55,30,15,0,0],5:[45,33,20,2,0],6:[35,40,20,5,0],7:[19,35,35,10,1],8:[15,25,35,20,5],9:[10,20,25,35,10]}[level] || [100,0,0,0,0];
                  const colors = ['#8a9aaa','#44cc66','#3399ff','#cc44ff','#ffcc44'];
                  return odds.map((o,i) => o > 0 && <div key={i} style={{color:colors[i]}}>• {o}%</div>);
                })()}
              </div>
            </div>

            <div style={{display:'flex', justifyContent:'center', alignItems:'center', gap:12, padding:'0 20px', height: '100%'}}>
              <div style={{display:'flex', flexDirection:'column', gap:6, width: 130, flexShrink:0}}>
                <button onClick={()=>{if(gold>=4){setGold(g=>g-4); setXp(x=>{const nx=x+4; if(nx>=XP_FOR_NEXT_LEVEL[level]){setLevel(l=>l+1); return nx-XP_FOR_NEXT_LEVEL[level];} return nx;});}}} style={{height: 38, background:'linear-gradient(135deg, rgba(16,35,57,1) 0%, rgba(26,159,255,0.15) 100%)', border:'1px solid rgba(26,159,255,.4)', borderRadius:4, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 10px', cursor:'pointer', color:'white'}}>
                  <div style={{display:'flex', flexDirection:'column', alignItems:'flex-start', fontFamily:'Noto Sans JP'}}>
                    <span style={{fontSize:13, fontWeight:700, lineHeight:1.2}}>XP購入</span>
                    <span style={{fontSize:11, color:'var(--gold2)', fontFamily:'Orbitron'}}>💰 4</span>
                  </div>
                </button>
                <button onClick={()=>{if(gold>=2){setGold(g=>g-2);setShop(rollShop(level, rng))}}} style={{height: 38, background:'linear-gradient(135deg, rgba(42,32,16,1) 0%, rgba(200,169,110,0.15) 100%)', border:'1px solid rgba(200,169,110,.4)', borderRadius:4, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 10px', cursor:'pointer', color:'white'}}>
                  <div style={{display:'flex', flexDirection:'column', alignItems:'flex-start', fontFamily:'Noto Sans JP'}}>
                    <span style={{fontSize:13, fontWeight:700, lineHeight:1.2}}>リロール</span>
                    <span style={{fontSize:11, color:'var(--gold2)', fontFamily:'Orbitron'}}>💰 2</span>
                  </div>
                </button>
              </div>

              <div style={{display:'flex', gap:8, height:'100%', padding: '8px 0'}}>
                {shop.map((champ,i)=>(
                  <div key={i} draggable={!!champ && gold>=champ.cost} onDragStart={champ ? (e)=>setDragSrc({type:'shop',idx:i}) : undefined} onClick={()=>{const unit=shop[i]; if(!unit||gold<unit.cost)return; const slot=bench.findIndex(x=>!x); if(slot===-1)return; let nb=[...bench], ns=[...shop]; nb[slot]={...unit, star:1, uid:rng()}; ns[i]=null; setGold(g=>g-unit.cost); setShop(ns); 
                    const counts={}; [...nb,...board].forEach(u=>{if(u){const k=`${u.id}_${u.star||1}`;counts[k]=(counts[k]||0)+1;}});
                    for(const k in counts){ if(counts[k]>=3){ const [id,s]=k.split('_'); const star=parseInt(s); if(star<3){ let toRem=3; for(let j=0;j<nb.length&&toRem>0;j++) if(nb[j]&&nb[j].id===id&&nb[j].star===star){nb[j]=null;toRem--;} for(let j=0;j<board.length&&toRem>0;j++) if(board[j]&&board[j].id===id&&board[j].star===star){board[j]=null;toRem--;} const up={...CHAMPS.find(c=>c.id===id), star:star+1, uid:rng()}; nb[nb.findIndex(x=>!x)]=up; setMergeToast(up); } } }
                    setBench(nb); setShop(ns);
                  }} style={{height:'100%', aspectRatio:'400 / 237', flexShrink:0, borderRadius:4, background:champ?'rgba(10,15,25,1)':'transparent', border:champ?`1px solid ${COST_COLORS[champ.cost]}`:'1px solid rgba(30,45,74,.3)', cursor:champ?'pointer':'default', position:'relative', overflow:'hidden', opacity: champ && gold < champ.cost ? 0.4 : 1}}>
                    {champ && (
                      <React.Fragment>
                        <img src={champIcon(champ.img)} style={{position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', pointerEvents:'none'}}/>
                        <div style={{position:'absolute', inset:0, background:'linear-gradient(0deg, rgba(10,15,25,1) 0%, transparent 45%, rgba(10,15,25,0.7) 100%)'}}></div>
                        <div style={{position:'absolute', top:0, left:'50%', transform:'translateX(-50%)', width:26, height:6, background:COST_COLORS[champ.cost], borderBottomLeftRadius:4, borderBottomRightRadius:4, border:'1px solid rgba(0,0,0,0.5)', borderTop:'none'}}></div>
                        <div style={{position:'absolute', top:12, left:6, display:'flex', flexDirection:'column', gap:3}}>
                          {champ.traits.map(t=>(
                            <div key={t} style={{display:'flex', alignItems:'center', gap:4}}>
                              <img src={getTraitIconUrl(t)} style={{width:12, height:12, filter:'drop-shadow(1px 1px 2px #000)'}} onError={(e)=>e.target.style.display='none'}/>
                              <span style={{fontSize:10, color:'white', fontWeight:600, textShadow:'1px 1px 2px #000'}}>{getTraitJaName(t)}</span>
                            </div>
                          ))}
                        </div>
                        <div style={{position:'absolute', bottom:4, left:6, right:6, display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>
                          <span style={{fontSize:12, fontWeight:900, color:'white', textShadow:'1px 1px 2px #000', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{champ.jaName}</span>
                          <span style={{fontSize:12, fontWeight:900, color:'var(--gold2)', textShadow:'1px 1px 2px #000', fontFamily:'Orbitron'}}>💰 {champ.cost}</span>
                        </div>
                      </React.Fragment>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </React.Fragment>
        ) : (<div style={{width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Noto Sans JP', color:'var(--textdim)', fontSize:12, opacity:0.5}}>・・・戦闘中・・　右上の「NEXT」を押してね</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Main/>);
</script>
</body>
</html>
